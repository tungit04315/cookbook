<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Yummy Recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="shortcut icon" href="cooking.png" type="image/x-icon">
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/spin.css">
</head>

<body class="theme-light">

  <!-- ============ APP CHÍNH (không cần đăng nhập, mở link là dùng luôn) ============ -->
  <div id="app" class="app">
    <div class="app-shell">
      <!-- Header -->
      <header id="appHeader"></header>

      <!-- Nội dung chính -->
      <main id="mainContent"></main>

      <!-- Mascot cố định phía trên thanh nav -->
      <img id="dashMascot" src="img/IMG_3635-Photoroom.png" class="dash-mascot hidden" alt="Mèo đầu bếp">

      <!-- Bottom nav -->
      <nav id="bottomNav" class="bottom-nav">
        <a href="#/dashboard" class="nav-item" data-route="dashboard">
          <div class="nav-icon">🏠</div>Trang chủ
        </a>
        <a href="#/recipes" class="nav-item" data-route="recipes">
          <div class="nav-icon">📖</div>Công thức
        </a>
        <a href="#/recipe-form" class="nav-item center" data-route="recipe-form">
          <div class="nav-icon">＋</div>
        </a>
        <a href="#/favorites" class="nav-item" data-route="favorites">
          <div class="nav-icon">🤍</div>Yêu thích
        </a>
        <a href="#/settings" class="nav-item" data-route="settings">
          <div class="nav-icon">👤</div>Cài đặt
        </a>
      </nav>
    </div>
  </div>

  <!-- Toast thông báo -->
  <div id="toast" class="toast hidden"></div>

  <!-- Modal overlay dùng chung (xác nhận xoá, nhật ký nấu ăn...) -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modalBox" class="modal-box"></div>
  </div>

  <!-- Loading spinner -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/spin.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
